[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uf-assistant-mcp"
version = "0.1.0"
description = "UF Stock Assistant MCP Server — 将股票助手能力暴露为 MCP Tools"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["mcp", "stock", "agent", "quant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "mcp>=1.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
uf-assistant-mcp = "uf_assistant_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
